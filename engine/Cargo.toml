[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/swiftugandan/powerstudio"
publish = false

[workspace.dependencies]
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
ps-sparse = { path = "crates/ps-sparse" }
ps-io = { path = "crates/ps-io" }
ps-lf = { path = "crates/ps-lf" }
ps-num = { path = "crates/ps-num" }
ps-model = { path = "crates/ps-model" }
ps-topology = { path = "crates/ps-topology" }
ps-net = { path = "crates/ps-net" }
ps-sc = { path = "crates/ps-sc" }
ps-dyn = { path = "crates/ps-dyn" }
ps-study = { path = "crates/ps-study" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"
needless_range_loop = "allow"
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
inherits = "release"
debug = true

# Tests and debug builds: dependencies (faer above all) optimised, so the large oracle cases run in seconds; the
# workspace's own crates keep a light optimisation that leaves them debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
