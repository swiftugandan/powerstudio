name: Test, build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit and engine tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (WebGPU and Canvas 2D projects)
        # Chromium's WebGPU instance does not survive on these runners (scripts/webgpu-probe.mjs, docs/TEST-REPORT.md),
        # so the webgpu project checks truthful reporting and real drawing here; WebGPU itself is required on macOS.
        env:
          PS_WEBGPU: optional
        run: npm run test:browser
      - name: Record which backend each browser test used
        if: always()
        run: node scripts/browser-report.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the site (marketing page, app at /app/, single-file download)
        run: node build-pages.mjs
      - id: hash
        name: Hash the app
        run: echo "sha256=$(sha256sum _site/PowerStudio.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Check that the published app and download are the build
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: |
          echo "Expected sha256: $EXPECTED"
          for attempt in $(seq 1 30); do
            app=$(curl -fsSL -H 'Cache-Control: no-cache' "${SITE}app/?build=${GITHUB_SHA}&attempt=${attempt}" | sha256sum | cut -d' ' -f1 || true)
            file=$(curl -fsSL -H 'Cache-Control: no-cache' "${SITE}PowerStudio.html?build=${GITHUB_SHA}&attempt=${attempt}" | sha256sum | cut -d' ' -f1 || true)
            home=$(curl -fsSL -o /dev/null -w '%{http_code}' "${SITE}?build=${GITHUB_SHA}" || true)
            echo "Attempt ${attempt}: app ${app}, download ${file}, home page HTTP ${home}"
            if [ "$app" = "$EXPECTED" ] && [ "$file" = "$EXPECTED" ] && [ "$home" = "200" ]; then
              {
                echo "### Published site verified"
                echo "\`${SITE}app/\` and \`${SITE}PowerStudio.html\` have sha256 \`${app}\`, identical to the build; the home page answers 200."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "The published site does not match the build." >&2
          exit 1
