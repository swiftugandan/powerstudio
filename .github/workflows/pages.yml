name: Test, build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Rust toolchain (pinned by engine/rust-toolchain.toml)
        working-directory: engine
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Engine format and lints
        run: npm run lint:engine
      - uses: actions/cache@v4
        with:
          path: .cache/reference
          key: reference-${{ hashFiles('tests/oracle/*-cases.json') }}
      - name: Reference models (CGMES and PSS/E test cases, checksums pinned)
        run: node scripts/fetch-reference.mjs
      - name: Engine tests (native, against the oracle goldens)
        run: npm run test:engine
      - name: Unit and engine tests (the WebAssembly build, native and WebAssembly compared)
        run: npm test
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests (Chromium with WebGPU and with Canvas 2D, Firefox, WebKit; accessibility audit)
        # Chromium's WebGPU instance does not survive on these runners (scripts/webgpu-probe.mjs, docs/TEST-REPORT.md),
        # so the webgpu project checks truthful reporting and real drawing here; WebGPU itself is required on macOS.
        env:
          PS_WEBGPU: optional
        run: npm run test:browser
      - name: Record which backend each browser test used
        if: always()
        run: node scripts/browser-report.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

  reproducible:
    # The engine must build to the same bytes on two operating systems, and again from another place on each.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Rust toolchain (pinned by engine/rust-toolchain.toml)
        working-directory: engine
        run: rustup toolchain install
      - name: Build the engine (WebAssembly)
        run: node scripts/build-engine.mjs
      - name: Build it again from a copy, with a fresh cargo home and target directory
        run: node scripts/check-reproducible.mjs
      - run: cp src/engine/powerstudio-engine.wasm.sha256 engine-${{ matrix.os }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: engine-hash-${{ matrix.os }}
          path: engine-${{ matrix.os }}.sha256

  reproducible-compare:
    needs: reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-hash-*
          merge-multiple: true
      - name: The builds on both systems are identical
        run: |
          cat engine-*.sha256
          test "$(cut -d' ' -f1 engine-*.sha256 | sort -u | wc -l)" -eq 1
          echo "### Reproducible engine: $(cut -d' ' -f1 engine-ubuntu-latest.sha256) on Ubuntu and macOS" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [test, reproducible-compare]
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Rust toolchain (pinned by engine/rust-toolchain.toml)
        working-directory: engine
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Build the engine (WebAssembly)
        run: node scripts/build-engine.mjs
      - name: Build the site (marketing page, app at /app/, single-file download)
        run: node build-pages.mjs
      - id: hash
        name: Hash the app
        run: echo "sha256=$(sha256sum _site/PowerStudio.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Check that the published app and download are the build
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: |
          echo "Expected sha256: $EXPECTED"
          for attempt in $(seq 1 30); do
            app=$(curl -fsSL -H 'Cache-Control: no-cache' "${SITE}app/?build=${GITHUB_SHA}&attempt=${attempt}" | sha256sum | cut -d' ' -f1 || true)
            file=$(curl -fsSL -H 'Cache-Control: no-cache' "${SITE}PowerStudio.html?build=${GITHUB_SHA}&attempt=${attempt}" | sha256sum | cut -d' ' -f1 || true)
            home=$(curl -fsSL -o /dev/null -w '%{http_code}' "${SITE}?build=${GITHUB_SHA}" || true)
            echo "Attempt ${attempt}: app ${app}, download ${file}, home page HTTP ${home}"
            if [ "$app" = "$EXPECTED" ] && [ "$file" = "$EXPECTED" ] && [ "$home" = "200" ]; then
              {
                echo "### Published site verified"
                echo "\`${SITE}app/\` and \`${SITE}PowerStudio.html\` have sha256 \`${app}\`, identical to the build; the home page answers 200."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "The published site does not match the build." >&2
          exit 1
