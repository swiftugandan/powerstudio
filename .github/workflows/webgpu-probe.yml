name: WebGPU probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node build.mjs
      - name: Probe Chromium WebGPU flag sets
        run: xvfb-run -a node scripts/webgpu-probe.mjs | tee -a "$GITHUB_STEP_SUMMARY"
